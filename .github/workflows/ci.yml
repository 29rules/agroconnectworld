name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vite/React)
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: runner.os !='Windows'
        run: |
          if [ -f package.json ]; then npm ci; else echo "no frontend yet"; fi
      - name: Install
        if: runner.os == 'Windows'
        run: |
            if (Test-Path "package.json") { npm ci } else { Write-Host "no frontend yet" }
        shell: pwsh
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build; else echo "skip build"; fi
      - name: Upload build artifact
        if: ${{ hashFiles('frontend/dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build (tests)
        run: |
          if [ -f pom.xml ]; then mvn -B -DskipTests=false clean verify; else echo "no backend yet"; fi
      - name: Upload JAR artifact
        if: ${{ hashFiles('backend/gateway/target/*.jar') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: backend/gateway/target/*.jar
