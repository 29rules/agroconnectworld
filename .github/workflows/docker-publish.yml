name: Docker Publish (GHCR)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agroconnect

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: login
    steps:
      - uses: actions/checkout@v4

      # ✅ Ensure Buildx uses the docker-container driver (supports GHA cache)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=tag
            # If you want 'latest' on tag builds too, remove the enable guard:
            type=raw,value=latest

      - name: Build and push (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gateway:
    runs-on: ubuntu-latest
    needs: login
    steps:
      - uses: actions/checkout@v4

      # ✅ Buildx again for this job
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push (gateway)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/gateway
          file: ./backend/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
