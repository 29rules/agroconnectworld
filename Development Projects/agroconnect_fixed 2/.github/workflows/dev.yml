name: Deploy to DEV

on:
  push:
    branches:
      - develop
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ENVIRONMENT: dev
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agroconnect

jobs:
  # ───────────────────────── Check Code Quality ─────────────────────────
  check-code:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Linting (Frontend)
        run: |
          cd frontend
          npm ci
          npm run lint || echo "Linting issues found"

      - name: Run Linting (Backend)
        run: |
          cd backend/gateway
          mvn checkstyle:check || echo "Checkstyle issues found"
        continue-on-error: true

  # ───────────────────────── Run Tests ─────────────────────────
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Unit Tests
        run: |
          cd backend/gateway
          mvn test

  # ───────────────────────── Security Scan ─────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: check-code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AgroConnectWorld'
          path: '.'
          format: 'HTML'
          failOnCVSS: 7
        continue-on-error: true

  # ───────────────────────── Build Docker Images ─────────────────────────
  build-images:
    name: Build Docker Images
    needs: [run-tests, security-scan]
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - frontend
          - gateway
          - auth-service
          - product-service
          - supplier-service
          - quote-service
          - order-service
          - contact-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || format('./backend/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./backend/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────── Deploy to DEV Server ─────────────────────────
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build-images
    environment:
      name: dev
      url: http://dev.agroconnectworld.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Deploy to DEV server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} << 'EOF'
            cd /opt/agroconnectworld/ops/environments/dev || exit 1
            
            # Pull latest images
            docker compose -f docker-compose.dev.yml pull
            
            # Deploy with zero-downtime
            docker compose -f docker-compose.dev.yml up -d --remove-orphans
            
            # Wait for services to be healthy
            sleep 30
            
            # Verify deployment
            docker compose -f docker-compose.dev.yml ps
          EOF

      - name: Run smoke tests
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} << 'EOF'
            # Health check
            curl -f http://localhost:8080/health || exit 1
            
            # API health check
            curl -f http://localhost:8080/api/health || echo "API health check skipped"
            
            # Frontend check
            curl -f http://localhost:8080/ || exit 1
            
            echo "✅ Smoke tests passed"
          EOF

      - name: Notify CEO Portal
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentStatus = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
            const message = `🚀 DEV Deployment ${deploymentStatus}\n\n` +
              `Environment: DEV\n` +
              `Branch: ${{ github.ref }}\n` +
              `Commit: ${{ github.sha }}\n` +
              `Actor: ${{ github.actor }}\n` +
              `URL: http://dev.agroconnectworld.com\n\n` +
              `[View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            // Send to CEO Portal webhook if configured
            if ('${{ secrets.CEO_PORTAL_WEBHOOK }}') {
              await fetch('${{ secrets.CEO_PORTAL_WEBHOOK }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: message,
                  environment: 'dev',
                  status: '${{ job.status }}'
                })
              });
            }
            
            // Also create a deployment status
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              description: `DEV deployment ${'${{ job.status }}' === 'success' ? 'succeeded' : 'failed'}`
            });

  # ───────────────────────── Deployment Summary ─────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## DEV Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All services deployed to DEV environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** DEV" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** http://dev.agroconnectworld.com" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY

