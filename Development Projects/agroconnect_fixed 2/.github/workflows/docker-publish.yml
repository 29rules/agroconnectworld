name: Docker Publish (GHCR)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agroconnect

jobs:
  # ───────────────────────── Build All Services ─────────────────────────
  build-services:
    name: Build & Push Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: gateway
            context: ./backend/gateway
            dockerfile: ./backend/gateway/Dockerfile
          - name: auth-service
            context: ./backend/auth-service
            dockerfile: ./backend/auth-service/Dockerfile
          - name: product-service
            context: ./backend/product-service
            dockerfile: ./backend/product-service/Dockerfile
          - name: supplier-service
            context: ./backend/supplier-service
            dockerfile: ./backend/supplier-service/Dockerfile
          - name: quote-service
            context: ./backend/quote-service
            dockerfile: ./backend/quote-service/Dockerfile
          - name: order-service
            context: ./backend/order-service
            dockerfile: ./backend/order-service/Dockerfile
          - name: contact-service
            context: ./backend/contact-service
            dockerfile: ./backend/contact-service/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ───────────────────────── Build Summary ─────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-services
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Docker images built and pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images:" >> $GITHUB_STEP_SUMMARY
          echo "- frontend" >> $GITHUB_STEP_SUMMARY
          echo "- gateway" >> $GITHUB_STEP_SUMMARY
          echo "- auth-service" >> $GITHUB_STEP_SUMMARY
          echo "- product-service" >> $GITHUB_STEP_SUMMARY
          echo "- supplier-service" >> $GITHUB_STEP_SUMMARY
          echo "- quote-service" >> $GITHUB_STEP_SUMMARY
          echo "- order-service" >> $GITHUB_STEP_SUMMARY
          echo "- contact-service" >> $GITHUB_STEP_SUMMARY
