name: Deploy to Pre-Prod (Staging)

on:
  workflow_run:
    workflows: ["Deploy to UAT"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      approved:
        description: 'CEO Approval'
        required: true
        type: boolean
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  ENVIRONMENT: preprod
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agroconnect

jobs:
  # ───────────────────────── Build Docker Images ─────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - frontend
          - gateway
          - auth-service
          - product-service
          - supplier-service
          - quote-service
          - order-service
          - contact-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=staging
            type=raw,value=${{ github.event.inputs.version || 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || format('./backend/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./backend/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────── Security Checks ─────────────────────────
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'https://staging.agroconnectworld.com'
          rules_file_name: '.zap/rules.tsv'
        continue-on-error: true

  # ───────────────────────── Architecture Validations ─────────────────────────
  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cd ops/environments/preprod
          docker compose -f docker-compose.preprod.yml config > /dev/null
          echo "✅ Docker Compose configuration valid"

      - name: Validate service ports
        run: |
          echo "Validating service port configurations..."
          # Check that all services have correct ports
          grep -r "EXPOSE" backend/*/Dockerfile
          echo "✅ Port validation complete"

      - name: Validate environment variables
        run: |
          echo "Validating environment variable declarations..."
          # Check .env.example files exist
          test -f ops/ENV_VARIABLES_GUIDE.md && echo "✅ Environment variables documented"
        continue-on-error: true

  # ───────────────────────── Deploy to Staging ─────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, security-checks, architecture-validation]
    environment:
      name: staging
      url: https://staging.agroconnectworld.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            cd /opt/agroconnectworld/ops/environments/preprod || exit 1
            
            # Pull latest images
            docker compose -f docker-compose.preprod.yml pull
            
            # Deploy with blue-green strategy
            docker compose -f docker-compose.preprod.yml up -d --remove-orphans
            
            # Wait for services
            sleep 30
            
            # Verify deployment
            docker compose -f docker-compose.preprod.yml ps
          EOF

      - name: Health checks
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            # Wait for services to be healthy
            for i in {1..30}; do
              if curl -f https://staging.agroconnectworld.com/health; then
                echo "✅ Services are healthy"
                break
              fi
              echo "Waiting for services... ($i/30)"
              sleep 10
            done
          EOF

  # ───────────────────────── Load Tests ─────────────────────────
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 load tests
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load/load-test.js
          cloud: false
        continue-on-error: true
        env:
          K6_VUS: 10
          K6_DURATION: 30s
          K6_TARGET_URL: https://staging.agroconnectworld.com

      - name: Load test summary
        if: always()
        run: |
          echo "## Load Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Load tests completed for staging environment" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────── Deployment Summary ─────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, load-tests]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Pre-Prod deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging (Pre-Prod)" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://staging.agroconnectworld.com" >> $GITHUB_STEP_SUMMARY
          echo "**Security Checks:** ${{ needs.security-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Load Tests:** ${{ needs.load-tests.result }}" >> $GITHUB_STEP_SUMMARY

