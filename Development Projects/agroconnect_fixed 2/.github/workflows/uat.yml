name: Deploy to UAT

on:
  push:
    branches:
      - 'release/**'
  workflow_run:
    workflows: ["Deploy to DEV"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  ENVIRONMENT: uat
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agroconnect

jobs:
  # ───────────────────────── Build Docker Images ─────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - frontend
          - gateway
          - auth-service
          - product-service
          - supplier-service
          - quote-service
          - order-service
          - contact-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=uat
            type=raw,value=${{ github.event.inputs.version || 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || format('./backend/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./backend/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────── Deploy to UAT Server ─────────────────────────
  deploy:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build-images
    environment:
      name: uat
      url: http://uat.agroconnectworld.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UAT_SSH_KEY }}

      - name: Deploy to UAT server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} << 'EOF'
            cd /opt/agroconnectworld/ops/environments/uat || exit 1
            
            # Pull latest images
            docker compose -f docker-compose.uat.yml pull
            
            # Deploy
            docker compose -f docker-compose.uat.yml up -d --remove-orphans
            
            # Wait for services
            sleep 30
            
            # Verify deployment
            docker compose -f docker-compose.uat.yml ps
          EOF

      - name: Run regression suite
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} << 'EOF'
            echo "Running regression test suite..."
            
            # Health checks
            curl -f http://localhost:8080/health || exit 1
            curl -f http://localhost:8080/api/health || echo "API health check skipped"
            
            # API endpoint tests
            curl -f http://localhost:8080/api/products || echo "Products endpoint test skipped"
            curl -f http://localhost:8080/api/auth/health || echo "Auth endpoint test skipped"
            
            # Frontend check
            curl -f http://localhost:8080/ || exit 1
            
            echo "✅ Regression tests passed"
          EOF

  # ───────────────────────── QA Approval ─────────────────────────
  qa-approval:
    name: QA Approval
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: uat-qa-approval
    steps:
      - name: Wait for QA approval
        run: |
          echo "⏳ Waiting for QA team approval..."
          echo "QA team can approve this deployment in GitHub Environments"

  # ───────────────────────── CEO Approval ─────────────────────────
  ceo-approval:
    name: CEO Approval
    runs-on: ubuntu-latest
    needs: qa-approval
    environment:
      name: uat-ceo-approval
    steps:
      - name: Wait for CEO approval
        run: |
          echo "⏳ Waiting for CEO approval..."
          echo "CEO can approve this deployment in GitHub Environments"
          
      - name: Notify CEO Portal
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `📋 UAT Deployment Ready for Approval\n\n` +
              `Environment: UAT\n` +
              `Branch: ${{ github.ref }}\n` +
              `Version: ${{ github.event.inputs.version || 'latest' }}\n` +
              `URL: http://uat.agroconnectworld.com\n\n` +
              `[View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            if ('${{ secrets.CEO_PORTAL_WEBHOOK }}') {
              await fetch('${{ secrets.CEO_PORTAL_WEBHOOK }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: message,
                  environment: 'uat',
                  requires_approval: true
                })
              });
            }

  # ───────────────────────── Deployment Summary ─────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: ceo-approval
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## UAT Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ UAT deployment completed with approvals" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** UAT" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** http://uat.agroconnectworld.com" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.ceo-approval.result }}" >> $GITHUB_STEP_SUMMARY

