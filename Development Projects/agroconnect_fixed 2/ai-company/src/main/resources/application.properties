# AgroConnectWorld AI Company Configuration

# LangChain4j Model Configuration
# Options: openai, anthropic, ollama
ai.model.provider=openai

# OpenRouter Configuration (if using OpenRouter)
openai.api.key=${OPENROUTER_API_KEY:${OPENAI_API_KEY:}}
openai.model=gpt-4.1
openai.temperature=0.7
openai.max.tokens=2000



# Anthropic Configuration (if using Claude)
anthropic.api.key=${ANTHROPIC_API_KEY:your-api-key-here}
anthropic.model=claude-3-opus-20240229
anthropic.temperature=0.7
anthropic.max.tokens=2000

# Ollama Configuration (if using local models)
ollama.base.url=http://localhost:11434
ollama.model=llama2

# Repository Paths
repository.root.path=..
docker.compose.path=../ops/docker-compose.yml
nginx.config.path=../ops/nginx/default.conf

# Zero-Impact Mode
zero.impact.mode.enabled=true
zero.impact.mode.strict=true

# Logging
logging.level.com.ai.company=DEBUG
logging.level.com.ai.company.audit=DEBUG
logging.level.com.ai.company.api=DEBUG
logging.level.com.ai.company.agents.cto=DEBUG
logging.level.dev.langchain4j=DEBUG
logging.level.org.springframework.web=DEBUG

# Session Management
session.timeout.minutes=60
session.max.messages=50

# Server Configuration
server.port=${AI_COMPANY_PORT:8087}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

