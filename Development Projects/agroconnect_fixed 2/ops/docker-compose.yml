name: ${PROJECT_NAME:-agroconnect}

networks:
  web: {}
  internal: {}

volumes:
  pg_data: {}
  minio_data: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service
    depends_on:
      - frontend
      - gateway   # enable when backend is running (profile: api)
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    environment:
      - NODE_ENV=production
    expose:
      - "8081"   # internal port served by edge
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────── ai-company (AI agents API) ──────────────────
  # Provides CEO portal AI endpoints on port 8087
  # Requires OPENROUTER_API_KEY in .env
  # Enable with: docker compose --profile api up -d
  ai-company:
    build:
      context: ../ai-company
      dockerfile: Dockerfile
    container_name: ai_company_service
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_COMPANY_PORT=8087
      - JWT_SECRET=${JWT_SECRET:-2PSi6ESWyf1OImIRWl4FaQ1QhsTpvmU2yi0CJJGqy6Q=}
    ports:
      - "8087:8087"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  # Enable with: docker compose --profile api up -d
  gateway:
    build:
      context: ../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service
    environment:
      - SERVER_PORT=${GATEWAY_PORT:-8080}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      # DB connection (Spring will pick these via application.properties)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-agro_master}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-agro}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      # Redis host/port (Spring Data Redis)
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis
      - auth-service
      - product-service
      - supplier-service
      - quote-service
      - order-service
      - contact-service
    expose:
      - "${GATEWAY_PORT:-8080}"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["api"]
    restart: unless-stopped

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8081"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  product-service:
    build:
      context: ../backend/product-service
      dockerfile: Dockerfile
    container_name: product_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8082"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  supplier-service:
    build:
      context: ../backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8083"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  quote-service:
    build:
      context: ../backend/quote-service
      dockerfile: Dockerfile
    container_name: quote_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8084"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  order-service:
    build:
      context: ../backend/order-service
      dockerfile: Dockerfile
    container_name: order_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8085"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  contact-service:
    build:
      context: ../backend/contact-service
      dockerfile: Dockerfile
    container_name: contact_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    expose:
      - "8086"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["api"]
    restart: unless-stopped

  # ────────────────────────── postgres (db) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro} -d ${POSTGRES_DB:-agro_master}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["db"]
    restart: unless-stopped

  # ─────────────────────────── redis (cache) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_service
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [internal]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["cache"]
    restart: unless-stopped

  # ────────────────────────── minio (object) ────────────────────────
  minio:
    image: quay.io/minio/minio
    container_name: minio_service
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-agroadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-agroadminpass}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["storage"]
    restart: unless-stopped
