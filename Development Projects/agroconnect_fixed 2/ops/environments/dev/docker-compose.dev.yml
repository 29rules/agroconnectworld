name: agroconnect-dev

networks:
  web: {}
  internal: {}

volumes:
  pg_data: {}
  redis_data: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service_dev
    depends_on:
      - frontend
      - gateway
    ports:
      - "8080:80"
    volumes:
      - ../../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, internal]
    environment:
      - ENV=development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: frontend_service_dev
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://dev.agroconnectworld.com/api}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
      - VITE_HMR_PORT=5173
      - VITE_HMR_HOST=dev.agroconnectworld.com
    volumes:
      # Hot reload: Mount source code for fast rebuild
      - ../../frontend/src:/app/src:ro
      - ../../frontend/public:/app/public:ro
      - ../../frontend/index.html:/app/index.html:ro
    expose:
      - "8081"
      - "5173"  # Vite HMR port
    ports:
      - "5173:5173"  # Expose Vite dev server for hot reload
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  gateway:
    build:
      context: ../../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Debug mode: Enable remote debugging
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - LOGGING_LEVEL_ROOT=DEBUG
    expose:
      - "8080"
      - "5005"  # Java debug port
    ports:
      - "5005:5005"  # Expose debug port
    volumes:
      # Fast rebuild: Mount source for hot reload (if using Spring DevTools)
      - ../../backend/gateway/src:/app/src:ro
    networks: [internal]
    depends_on:
      - postgres
      - redis
      - auth_service
      - product_service
      - supplier_service
      - quote_service
      - order_service
      - contact_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── auth-service (Spring Boot) ────────────────────
  auth_service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=auth_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
    expose:
      - "8081"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── product-service (Spring Boot) ────────────────────
  product_service:
    build:
      context: ../../backend/product-service
      dockerfile: Dockerfile
    container_name: product_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=product_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
    expose:
      - "8082"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── supplier-service (Spring Boot) ────────────────────
  supplier_service:
    build:
      context: ../../backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=supplier_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
    expose:
      - "8083"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── quote-service (Spring Boot) ────────────────────
  quote_service:
    build:
      context: ../../backend/quote-service
      dockerfile: Dockerfile
    container_name: quote_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=quote_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
    expose:
      - "8084"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── order-service (Spring Boot) ────────────────────
  order_service:
    build:
      context: ../../backend/order-service
      dockerfile: Dockerfile
    container_name: order_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=order_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
    expose:
      - "8085"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── contact-service (Spring Boot) ────────────────────
  contact_service:
    build:
      context: ../../backend/contact-service
      dockerfile: Dockerfile
    container_name: contact_service_dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=contact_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-agro_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-agro_pass}
    expose:
      - "8086"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── postgres ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    environment:
      - POSTGRES_DB=agro_master
      - POSTGRES_USER=${DB_USERNAME:-agro_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-agro_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agro_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── redis ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_dev
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── Development Tools ────────────────────────
  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@dev.local
      - PGADMIN_DEFAULT_PASSWORD=dev_admin_pass
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [internal]
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ["tools"]

volumes:
  pg_data: {}
  redis_data: {}
  pgadmin_data: {}

