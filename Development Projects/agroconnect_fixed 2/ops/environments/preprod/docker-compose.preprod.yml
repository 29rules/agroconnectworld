name: agroconnect-preprod

networks:
  web: {}
  internal: {}

volumes:
  pg_data_preprod: {}
  redis_data_preprod: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service_preprod
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [web, internal]
    environment:
      - ENV=preprod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: frontend_service_preprod
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://staging.agroconnectworld.com/api}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
    expose:
      - "8081"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  gateway:
    build:
      context: ../../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8080"
    networks: [internal]
    depends_on:
      - postgres
      - redis
      - auth_service
      - product_service
      - supplier_service
      - quote_service
      - order_service
      - contact_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── auth-service (Spring Boot) ────────────────────
  auth_service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=auth_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "8081"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── product-service (Spring Boot) ────────────────────
  product_service:
    build:
      context: ../../backend/product-service
      dockerfile: Dockerfile
    container_name: product_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=product_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8082"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── supplier-service (Spring Boot) ────────────────────
  supplier_service:
    build:
      context: ../../backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=supplier_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8083"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── quote-service (Spring Boot) ────────────────────
  quote_service:
    build:
      context: ../../backend/quote-service
      dockerfile: Dockerfile
    container_name: quote_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=quote_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8084"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── order-service (Spring Boot) ────────────────────
  order_service:
    build:
      context: ../../backend/order-service
      dockerfile: Dockerfile
    container_name: order_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=order_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8085"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── contact-service (Spring Boot) ────────────────────
  contact_service:
    build:
      context: ../../backend/contact-service
      dockerfile: Dockerfile
    container_name: contact_service_preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=contact_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8086"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── postgres ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_preprod
    environment:
      - POSTGRES_DB=agro_master
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_preprod:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── redis ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_preprod
    volumes:
      - redis_data_preprod:/data
    ports:
      - "6381:6379"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── Prometheus (Metrics) ────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_preprod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_preprod:/prometheus
    networks: [internal]
    restart: unless-stopped
    profiles: ["monitoring"]

  # ──────────────────────── Grafana (Visualization) ────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_preprod
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_data_preprod:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  pg_data_preprod: {}
  redis_data_preprod: {}
  prometheus_data_preprod: {}
  grafana_data_preprod: {}

