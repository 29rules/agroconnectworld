name: agroconnect-prod

networks:
  web: {}
  internal: {}

volumes:
  pg_data_prod: {}
  redis_data_prod: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service_prod
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [web, internal]
    environment:
      - ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: frontend_service_prod
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://www.agroconnectworld.com/api}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
    expose:
      - "8081"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  gateway:
    build:
      context: ../../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8080"
    networks: [internal]
    depends_on:
      - postgres
      - redis
      - auth_service
      - product_service
      - supplier_service
      - quote_service
      - order_service
      - contact_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── auth-service (Spring Boot) ────────────────────
  auth_service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=auth_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "8081"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── product-service (Spring Boot) ────────────────────
  product_service:
    build:
      context: ../../backend/product-service
      dockerfile: Dockerfile
    container_name: product_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=product_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8082"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── supplier-service (Spring Boot) ────────────────────
  supplier_service:
    build:
      context: ../../backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=supplier_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8083"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── quote-service (Spring Boot) ────────────────────
  quote_service:
    build:
      context: ../../backend/quote-service
      dockerfile: Dockerfile
    container_name: quote_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=quote_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8084"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── order-service (Spring Boot) ────────────────────
  order_service:
    build:
      context: ../../backend/order-service
      dockerfile: Dockerfile
    container_name: order_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=order_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8085"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────── contact-service (Spring Boot) ────────────────────
  contact_service:
    build:
      context: ../../backend/contact-service
      dockerfile: Dockerfile
    container_name: contact_service_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=contact_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8086"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────────── postgres ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_prod
    environment:
      - POSTGRES_DB=agro_master
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./backups:/backups:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ──────────────────────── redis ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_prod
    volumes:
      - redis_data_prod:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ──────────────────────── Load Balancer (Nginx) ────────────────────────
  nginx-lb:
    image: nginx:alpine
    container_name: nginx_load_balancer_prod
    ports:
      - "8080:80"  # Internal load balancer port
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]
    depends_on:
      - gateway
      - frontend
    restart: always
    profiles: ["load-balancer"]

  # ──────────────────────── Backup Service ────────────────────────
  backup-service:
    image: postgres:16-alpine
    container_name: backup_service_prod
    environment:
      - PGHOST=postgres
      - PGDATABASE=agro_master
      - PGUSER=${DB_USERNAME}
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
    volumes:
      - ./backups:/backups
      - ./backup-script.sh:/backup-script.sh:ro
    networks: [internal]
    depends_on:
      - postgres
    command: >
      sh -c "
        chmod +x /backup-script.sh &&
        crond -f -l 2
      "
    restart: always
    profiles: ["backup"]

volumes:
  pg_data_prod: {}
  redis_data_prod: {}

