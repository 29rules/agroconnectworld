upstream frontend_backend {
    least_conn;
    server frontend_service_prod:8081 max_fails=3 fail_timeout=30s;
    # Add more instances for high availability
    # server frontend_service_prod_2:8081 max_fails=3 fail_timeout=30s;
}

upstream gateway_backend {
    least_conn;
    server gateway_service_prod:8080 max_fails=3 fail_timeout=30s;
    # Add more instances for high availability
    # server gateway_service_prod_2:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Health check endpoint
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Frontend load balancing
    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check for upstream
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # API Gateway load balancing
    location /api/ {
        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check for upstream
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}



