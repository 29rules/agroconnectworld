name: agroconnect-uat

networks:
  web: {}
  internal: {}

volumes:
  pg_data_uat: {}
  redis_data_uat: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service_uat
    depends_on:
      - frontend
      - gateway
    ports:
      - "8080:80"
    volumes:
      - ../../nginx/uat.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, internal]
    environment:
      - ENV=uat
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: frontend_service_uat
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://uat.agroconnectworld.com/api}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
    expose:
      - "8081"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  gateway:
    build:
      context: ../../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8080"
    networks: [internal]
    depends_on:
      - postgres
      - redis
      - auth_service
      - product_service
      - supplier_service
      - quote_service
      - order_service
      - contact_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── auth-service (Spring Boot) ────────────────────
  auth_service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=auth_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "8081"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── product-service (Spring Boot) ────────────────────
  product_service:
    build:
      context: ../../backend/product-service
      dockerfile: Dockerfile
    container_name: product_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=product_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8082"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── supplier-service (Spring Boot) ────────────────────
  supplier_service:
    build:
      context: ../../backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=supplier_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8083"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── quote-service (Spring Boot) ────────────────────
  quote_service:
    build:
      context: ../../backend/quote-service
      dockerfile: Dockerfile
    container_name: quote_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=quote_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8084"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── order-service (Spring Boot) ────────────────────
  order_service:
    build:
      context: ../../backend/order-service
      dockerfile: Dockerfile
    container_name: order_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=order_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8085"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────── contact-service (Spring Boot) ────────────────────
  contact_service:
    build:
      context: ../../backend/contact-service
      dockerfile: Dockerfile
    container_name: contact_service_uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agro_master?currentSchema=contact_service
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    expose:
      - "8086"
    networks: [internal]
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── postgres ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_uat
    environment:
      - POSTGRES_DB=agro_master
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_uat:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── redis ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_uat
    volumes:
      - redis_data_uat:/data
    ports:
      - "6380:6379"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── QA Test Runner ────────────────────────
  qa-test-runner:
    image: node:20-alpine
    container_name: qa_test_runner_uat
    working_dir: /app
    volumes:
      - ../../ai-company:/app/ai-company:ro
      - ../../frontend:/app/frontend:ro
      - ../../backend:/app/backend:ro
      - qa_test_results:/app/results
    environment:
      - NODE_ENV=test
      - UAT_API_URL=http://gateway_service_uat:8080
      - UAT_FRONTEND_URL=http://frontend_service_uat:8081
    command: >
      sh -c "
        echo 'QA Test Runner for UAT Environment' &&
        echo 'Running comprehensive test suite...' &&
        cd /app/ai-company &&
        mvn -q exec:java -Dexec.mainClass='com.ai.company.tests.TestWebsiteComprehensive' -Dexec.args='uat' || true &&
        echo 'QA tests completed. Results saved to /app/results'
      "
    networks: [internal]
    depends_on:
      - gateway
      - frontend
    restart: "no"
    profiles: ["qa"]

  # ──────────────────────── CEO Portal Validator ────────────────────────
  ceo-portal-validator:
    image: curlimages/curl:latest
    container_name: ceo_portal_validator_uat
    environment:
      - UAT_API_URL=http://gateway_service_uat:8080
      - CEO_EMAIL=${CEO_EMAIL}
      - CEO_PASSWORD=${CEO_PASSWORD}
    command: >
      sh -c "
        echo 'CEO Portal Validation for UAT' &&
        echo 'Validating CEO access, dashboard endpoints, and security...' &&
        sleep 10 &&
        curl -f http://gateway_service_uat:8080/actuator/health || exit 1 &&
        echo 'CEO Portal validation completed'
      "
    networks: [internal]
    depends_on:
      - gateway
    restart: "no"
    profiles: ["validation"]

volumes:
  pg_data_uat: {}
  redis_data_uat: {}
  qa_test_results: {}

