global:
  resolve_timeout: 5m
  # Slack webhook URL (configure in environment)
  # Get webhook URL from: https://api.slack.com/messaging/webhooks
  slack_api_url: '${SLACK_WEBHOOK_URL:-}'
  # Email SMTP configuration (configure in environment)
  # Gmail example: smtp.gmail.com:587
  # Outlook example: smtp-mail.outlook.com:587
  smtp_smarthost: '${SMTP_HOST:-smtp.gmail.com:587}'
  smtp_from: '${ALERT_EMAIL_FROM:-alerts@agroconnectworld.com}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  smtp_hello: 'agroconnectworld.com'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts go to on-call
    - match:
        severity: critical
      receiver: 'on-call'
      continue: true
    
    # Warning alerts go to team channel
    - match:
        severity: warning
      receiver: 'team-channel'

# Inhibition rules (suppress alerts)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

# Receivers
receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL_TO:-devops@agroconnectworld.com}'
        headers:
          Subject: 'AgroConnectWorld Alert: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'on-call'
    email_configs:
      - to: '${ONCALL_EMAIL:-oncall@agroconnectworld.com}'
        headers:
          Subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        html: |
          <h2>🚨 Critical Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Service:</strong> {{ .GroupLabels.service }}</p>
          <p><strong>Environment:</strong> {{ .GroupLabels.environment }}</p>
          <p><strong>Description:</strong></p>
          <p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>
        send_resolved: true
    # Slack notification (if configured)
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        channel: '${SLACK_CHANNEL_CRITICAL:-#alerts-critical}'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Service:* {{ .GroupLabels.service }}
          *Environment:* {{ .GroupLabels.environment }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Time:* {{ .StartsAt }}
        send_resolved: true
        color: 'danger'

  - name: 'team-channel'
    email_configs:
      - to: '${TEAM_EMAIL:-team@agroconnectworld.com}'
        headers:
          Subject: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        html: |
          <h2>⚠️ Warning Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Service:</strong> {{ .GroupLabels.service }}</p>
          <p><strong>Environment:</strong> {{ .GroupLabels.environment }}</p>
          <p><strong>Description:</strong></p>
          <p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>
        send_resolved: true
    # Slack notification (if configured)
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        channel: '${SLACK_CHANNEL_WARNING:-#alerts-warning}'
        title: '⚠️ Warning Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Service:* {{ .GroupLabels.service }}
          *Environment:* {{ .GroupLabels.environment }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Time:* {{ .StartsAt }}
        send_resolved: true
        color: 'warning'

