global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agroconnectworld'
    environment: '${ENV:-production}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Actuator endpoints
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway_service:8080']
        labels:
          service: 'gateway'
          environment: '${ENV}'

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth_service:8081']
        labels:
          service: 'auth-service'
          environment: '${ENV}'

  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product_service:8082']
        labels:
          service: 'product-service'
          environment: '${ENV}'

  - job_name: 'supplier-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['supplier_service:8083']
        labels:
          service: 'supplier-service'
          environment: '${ENV}'

  - job_name: 'quote-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['quote_service:8084']
        labels:
          service: 'quote-service'
          environment: '${ENV}'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order_service:8085']
        labels:
          service: 'order-service'
          environment: '${ENV}'

  - job_name: 'contact-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['contact_service:8086']
        labels:
          service: 'contact-service'
          environment: '${ENV}'

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: 'node-exporter'

  # Nginx metrics (if nginx-prometheus-exporter is added)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'



