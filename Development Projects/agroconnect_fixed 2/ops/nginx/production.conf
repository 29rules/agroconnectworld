# Redirect non-www to www
server {
  listen 80;
  listen 443 ssl http2;
  server_name agroconnectworld.com;

  ssl_certificate /etc/nginx/ssl/agroconnectworld.com.crt;
  ssl_certificate_key /etc/nginx/ssl/agroconnectworld.com.key;

  return 301 https://www.agroconnectworld.com$request_uri;
}

# Main production server
server {
  listen 80;
  server_name www.agroconnectworld.com agroconnectworld.com;

  # Redirect HTTP to HTTPS
  return 301 https://www.agroconnectworld.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.agroconnectworld.com;

  # SSL Configuration
  ssl_certificate /etc/nginx/ssl/www.agroconnectworld.com.crt;
  ssl_certificate_key /etc/nginx/ssl/www.agroconnectworld.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

  # CORS for production
  add_header Access-Control-Allow-Origin "https://www.agroconnectworld.com" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
  add_header Access-Control-Allow-Credentials true always;

  # Rate Limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  location /health {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # React app behind nginx
  location / {
    limit_req zone=general_limit burst=20 nodelay;
    proxy_pass http://frontend_service_prod:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Production optimizations
    proxy_buffering on;
    proxy_cache_valid 200 1h;
  }

  # API Gateway with rate limiting
  location /api/ {
    limit_req zone=api_limit burst=10 nodelay;
    proxy_pass http://gateway_service_prod:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Production optimizations
    proxy_buffering on;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # Metrics endpoint (for Prometheus) - Internal only
  location /metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    proxy_pass http://gateway_service_prod:8080/actuator/prometheus;
    proxy_set_header Host $host;
    access_log off;
  }
}



