server {
  listen 80;
  server_name staging.agroconnectworld.com;

  # Redirect HTTP to HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name staging.agroconnectworld.com;

  # SSL Configuration
  ssl_certificate /etc/nginx/ssl/staging.agroconnectworld.com.crt;
  ssl_certificate_key /etc/nginx/ssl/staging.agroconnectworld.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # CORS for staging
  add_header Access-Control-Allow-Origin "https://staging.agroconnectworld.com" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
  add_header Access-Control-Allow-Credentials true always;

  location /health {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # React app behind nginx
  location / {
    proxy_pass http://frontend_service_preprod:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API Gateway
  location /api/ {
    proxy_pass http://gateway_service_preprod:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Metrics endpoint (for Prometheus)
  location /metrics {
    proxy_pass http://gateway_service_preprod:8080/actuator/prometheus;
    proxy_set_header Host $host;
    access_log off;
  }
}



