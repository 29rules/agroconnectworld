server {
  listen 80;
  server_name uat.agroconnectworld.com;

  # UAT: Restricted CORS
  add_header Access-Control-Allow-Origin "https://uat.agroconnectworld.com" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
  add_header Access-Control-Allow-Credentials true always;

  location /health {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # React app behind nginx
  location / {
    proxy_pass http://frontend_service_uat:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API Gateway
  location /api/ {
    proxy_pass http://gateway_service_uat:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}



