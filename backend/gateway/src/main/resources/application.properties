# Let Docker/compose set the port via SERVER_PORT env (defaults to 8080)
server.port=${SERVER_PORT:8080}

# --- Postgres ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agro_master}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agro_pass}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Redis ---
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health,info
