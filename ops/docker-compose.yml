name: ${PROJECT_NAME:-agroconnect}

networks:
  web: {}
  internal: {}

volumes:
  pg_data: {}
  minio_data: {}

services:
  # ───────────────────────── nginx (edge) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edge_service
    depends_on:
      - frontend
      # - gateway   # enable when backend is running (profile: api)
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────── frontend (React) ───────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    environment:
      - NODE_ENV=production
    expose:
      - "8081"   # internal port served by edge
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ───────────────────── gateway (Spring Boot) ─────────────────────
  # Enable with: docker compose --profile api up -d
  gateway:
    build:
      context: ../backend/gateway
      dockerfile: Dockerfile
    container_name: gateway_service
    environment:
      - SERVER_PORT=${GATEWAY_PORT:-8080}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
    expose:
      - "${GATEWAY_PORT:-8080}"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT:-8080}/actuator/health || curl -sf http://localhost:${GATEWAY_PORT:-8080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["api"]
    restart: unless-stopped

  # ────────────────────────── postgres (db) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agro_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agro_master}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    profiles: ["db"]
    restart: unless-stopped

  # ─────────────────────────── redis (cache) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_service
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [internal]
    profiles: ["cache"]
    restart: unless-stopped

  # ────────────────────────── minio (object) ────────────────────────
  minio:
    image: quay.io/minio/minio
    container_name: minio_service
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-agroadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-agroadminpass}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [internal]
    profiles: ["storage"]
    restart: unless-stopped
